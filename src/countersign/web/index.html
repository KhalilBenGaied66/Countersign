<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countersign</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 16.5l5 5 9-11' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">

          <rect width="32" height="32" rx="7" />
          <path d="M9 16.5l5 5 9-11" />
        </svg>
        Countersign

      <nav id="nav" aria-label="Sections">
        <a href="#/" data-route="overview">Overview</a>
        <a href="#/review" data-route="review">Review <span id="review-count" class="count" hidden></span></a>
        <a href="#/documents" data-route="documents">Documents</a>
        <a href="#/suppliers" data-route="suppliers">Suppliers</a>

        <span id="readiness" class="readiness" title="Model server">checking</span>

      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js" type="module"></script>
  </body>
</html>
