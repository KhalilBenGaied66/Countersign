[project]
name = "countersign"
version = "0.1.0"
description = "Supplier-invoice intake pipeline: local LLMs extract, deterministic checks countersign, people review the rest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16",
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "pillow>=11.0",
    "prometheus-client>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pypdf>=5.4",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# Send traces to a collector (Jaeger, Tempo, ...). Without it, spans stay in process.
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.30"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
countersign = "countersign.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "hypothesis>=6.120",
    "matplotlib>=3.10",
    "mypy>=1.14",
    # The exporter of the `otlp` extra: the suite sends spans to a local receiver with it.
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Synthetic invoices: the dataset generator and the fixtures of the test suite.
    "reportlab>=4.2",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countersign"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "S", "RUF", "PT", "PL"]
ignore = [
    "S101",    # assert is the point of tests
    "B008",    # FastAPI `Depends()` in signatures
    "PLR2004", # magic values: rates, tolerances and status codes read better inline
    # Size thresholds: a check that returns early for each case it rules out is longer
    # and clearer than the same logic folded to fit a count.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Tests print what suppliers print (accents, currency signs, narrow spaces) and reach
# into private helpers on purpose.
"tests/*" = ["S105", "S106", "S311", "RUF001", "PLC0415", "SLF001"]
"src/countersign/datagen/*" = ["S311"] # seeded pseudo-random data, not security

[tool.ruff.lint.isort]
known-first-party = ["countersign"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "pypdfium2.*",
    "defusedxml.*",
    "matplotlib.*",
    # Optional extra: only imported when an OTLP endpoint is configured.
    "opentelemetry.exporter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: needs a running Ollama server with the benchmark models (deselected by default)",
]
filterwarnings = ["error", "ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["countersign"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
