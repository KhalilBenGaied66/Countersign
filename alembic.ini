# For development, from the root of the repository: `alembic revision --autogenerate
# -m "..."`, `alembic upgrade head`. The database is the one of the settings
# (COUNTERSIGN_DATABASE_URL).
#
# An installed application does not need this file: it applies migrations itself at
# start-up, and `countersign migrate` does it by hand.

[alembic]
script_location = src/countersign/store/migrations
file_template = %%(rev)s_%%(slug)s
